<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Weborn logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e54d5e"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e6e9ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" filter="url(#soft)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- orbital ring (web / panel) -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10">
    <ellipse cx="256" cy="256" rx="176" ry="52" />
    <ellipse cx="256" cy="256" rx="52" ry="176" />
  </g>

  <!-- node -->
  <circle cx="256" cy="256" r="96" fill="url(#gem)"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>

  <!-- "W" glyph (double chevron) -->
  <g fill="none" stroke="#15162b" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 170 208 L 214 320 L 256 240 L 298 320 L 342 208"/>
  </g>

  <!-- ground line / terminal prompt -->
  <rect x="176" y="364" width="160" height="12" rx="6" fill="#15162b" opacity="0.85"/>
</svg>