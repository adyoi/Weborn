{% extends "base.html" %}
{% block title %}Changelog — Weborn{% endblock %}
{% block content %}
<div class="page-title text-[22px] font-bold mb-1">📋 Changelog</div>
<div class="page-sub text-t3 text-[13px] mb-5">Riwayat perubahan versi</div>

<div class="card">
    {% if changelog %}
    <div class="prose prose-sm max-w-none text-[14px] leading-relaxed" style="font-family:inherit">{{ changelog | safe }}</div>
    {% else %}
    <div class="text-center text-t3 py-7">Changelog tidak ditemukan.</div>
    {% endif %}
</div>
{% endblock %}
