{% extends "base.html" %}
{% block title %}Test — Weborn{% endblock %}
{% block content %}
<div class="page-title text-[22px] font-bold mb-1">🧪 Test</div>
<div class="page-sub text-t3 text-[13px] mb-5">Cek ketersediaan service & tools di server</div>

<div class="card mb-4">
    <button class="btn primary sm" onclick="runTest()" id="btn-test">▶ Jalankan Test</button>
</div>

<div class="card !p-0 overflow-hidden">
    <table>
        <thead><tr><th>Component</th><th>Status</th><th>Output</th></tr></thead>
        <tbody id="test-results">
            <tr><td colspan="3" class="text-center text-t3 py-5">Klik tombol di atas untuk mulai test.</td></tr>
        </tbody>
    </table>
</div>

<script>
function runTest() {
    var btn = document.getElementById('btn-test');
    var tbody = document.getElementById('test-results');
    btn.disabled = true; btn.textContent = '⏳ Testing...';
    tbody.innerHTML = '<tr><td colspan="3" class="text-center py-3 text-[12px]">Menjalankan test...</td></tr>';
    fetch('/info/test/run', {method:'POST'}).then(function(r){return r.json()}).then(function(d){
        var html = '';
        (d.results||[]).forEach(function(r){
            var cls = r.ok ? 'active' : 'failed';
            var ico = r.ok ? '✅' : '❌';
            html += '<tr><td class="text-[12px]">'+r.label+'</td>';
            html += '<td><span class="st '+cls+'">'+ico+'</span></td>';
            html += '<td class="mono text-[11px] text-t3">'+r.output+'</td></tr>';
        });
        tbody.innerHTML = html || '<tr><td colspan="3" class="text-center py-3">No results</td></tr>';
        btn.disabled = false; btn.textContent = '▶ Jalankan Test';
    }).catch(function(){
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-t3 py-3">Error</td></tr>';
        btn.disabled = false; btn.textContent = '▶ Jalankan Test';
    });
}
</script>
{% endblock %}
